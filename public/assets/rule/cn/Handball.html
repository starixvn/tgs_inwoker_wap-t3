<!DOCTYPE html>
<html lang="en">

<body>
    <h4><span>手球</span></h4>

    <h5>手球交易规则</h5>

        <p>
        <span class="about-con-intip1-rule"></span>1. 所有全场赌盘（包含实时投注）是以正规时间结束时的结果进行结算。加时赛和罚球决胜赛不计入全场赌盘的计算结果。
    </p>
    <p>
        <span class="about-con-intip1-rule"></span>2.如果比赛延期、暂停或中止，并且未于原定开始时间的十二小时内恢复比赛，所有投注均作废，无条件决定投注结果的赌盘除外。如果由相关管理机构宣布官方结果，投注仍然有效。
    </p>
    <p>
        <span class="about-con-intip1-rule"></span>3. 手球实时投注”是以正规时间结束时的结果进行结算。
    </p>
    <p>
        <span class="about-con-intip1-rule"></span>4.手球实时投注的分数不会更新。
    </p>
</body>
</html>
