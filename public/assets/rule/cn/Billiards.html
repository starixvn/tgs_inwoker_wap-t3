<!DOCTYPE html>
<html lang="en">

<body>
    <h4><span>台球</span></h4>

    <h5>台球交易规则</h5>

    <p>
        <span class="about-con-intip1-rule"></span>1. 胜负盘及让分盘是指比赛的赢家。“大于／小于”及“奇数／偶数”是根据盘 数／三角框数而定（除非另有说明）。
    </p>
    <p>
        <span class="about-con-intip1-rule"></span>2. 如果选手没有参加锦标赛或比赛，投在该名选手身上的赌金均作废。
    </p>
    <p>
        <span class="about-con-intip1-rule"></span>3. 如果比赛已开始但未结束，则所有投注均作废，无条件决定投注结果的赌盘除外。
    </p>
    <p>
        <span class="about-con-intip1-rule"></span>4. “台球实时投注”的结果是根据比赛（或指定盘／三角框）结果进行结算。台球实时投注的分数不会更新。
    </p>
</body>
</html>
